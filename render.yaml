services:
  - type: web
    name: retail-data-hub-api
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn src.api.api:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: CORS_ORIGINS
        value: "*"
      - key: PYTHONPATH
        value: .
